<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3cc4f0"/>
      <stop offset="1" stop-color="#17b2e7"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b77a3"/>
      <stop offset="0.5" stop-color="#0e8bbd"/>
      <stop offset="1" stop-color="#0b77a3"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="0.65" stop-color="#241f31"/>
      <stop offset="1" stop-color="#171421"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e45c"/>
      <stop offset="1" stop-color="#f6d32d"/>
    </linearGradient>
    <clipPath id="face">
      <rect x="8" y="8" width="112" height="104" rx="20"/>
    </clipPath>
  </defs>

  <!-- plinth: side, then top face -->
  <rect x="8" y="14" width="112" height="106" rx="20" fill="url(#side)"/>
  <rect x="8" y="8" width="112" height="104" rx="20" fill="url(#top)"/>
  <!-- faint Kodi-ish rounded diamond motif + top-edge highlight -->
  <g clip-path="url(#face)">
    <rect x="58" y="-14" width="84" height="84" rx="16" fill="#ffffff" fill-opacity="0.10"
          transform="rotate(45 100 28)"/>
  </g>
  <path d="M28 9 H100" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

  <!-- platter rim -->
  <circle cx="50" cy="55" r="39" fill="#0b6f98" fill-opacity="0.55"/>
  <circle cx="50" cy="54" r="38" fill="#c0bfbc"/>
  <circle cx="50" cy="54" r="38" fill="none" stroke="#9a9996" stroke-width="1"/>
  <!-- record -->
  <circle cx="50" cy="54" r="35" fill="url(#vinyl)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.2">
    <circle cx="50" cy="54" r="30"/>
    <circle cx="50" cy="54" r="25"/>
    <circle cx="50" cy="54" r="20"/>
  </g>
  <path d="M26 38 A30 30 0 0 1 44 25" fill="none" stroke="#ffffff" stroke-opacity="0.28"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M74 70 A30 30 0 0 1 60 82" fill="none" stroke="#ffffff" stroke-opacity="0.12"
        stroke-width="3" stroke-linecap="round"/>
  <!-- label with small Kodi-blue diamond -->
  <circle cx="50" cy="54" r="13" fill="url(#label)"/>
  <circle cx="50" cy="54" r="13" fill="none" stroke="#e5a50a" stroke-width="1"/>
  <rect x="44.5" y="48.5" width="11" height="11" rx="2.5" fill="#17b2e7"
        transform="rotate(45 50 54)"/>
  <circle cx="50" cy="54" r="1.8" fill="#241f31"/>

  <!-- controls: 33/45, LED -->
  <circle cx="21" cy="100.5" r="4" fill="#0b77a3"/>
  <circle cx="21" cy="99.5" r="3.6" fill="#f6f5f4"/>
  <circle cx="31" cy="100.5" r="4" fill="#0b77a3"/>
  <circle cx="31" cy="99.5" r="3.6" fill="#deddda"/>
  <circle cx="21" cy="99.5" r="1.4" fill="#2ec27e"/>
  <circle cx="40" cy="99.5" r="1.8" fill="#e01b24"/>
  <circle cx="40" cy="99.5" r="3.4" fill="#ff7b63" fill-opacity="0.35"/>

  <!-- pitch slider -->
  <rect x="103" y="52" width="5" height="44" rx="2.5" fill="#0b77a3"/>
  <path d="M110.5 56 H113 M110.5 74 H114 M110.5 92 H113" stroke="#0b77a3" stroke-width="1.5"
        stroke-linecap="round"/>
  <rect x="98" y="68" width="15" height="8" rx="2.5" fill="#0b77a3"/>
  <rect x="98" y="67" width="15" height="7" rx="2.5" fill="#f6f5f4"/>
  <path d="M100.5 70.5 H110.5" stroke="#9a9996" stroke-width="1.2" stroke-linecap="round"/>

  <!-- tonearm: counterweight, arm, headshell, pivot -->
  <path d="M100 24 L106.5 12" stroke="#5e5c64" stroke-width="3" stroke-linecap="round"/>
  <rect x="101.5" y="6" width="10" height="9" rx="3" fill="#3d3846" transform="rotate(28 106.5 10.5)"/>
  <path d="M100 24 L93 62 L76 76" fill="none" stroke="#0b77a3" stroke-opacity="0.5" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5 2.5)"/>
  <path d="M100 24 L93 62 L76 76" fill="none" stroke="url(#metal)" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="67" y="72" width="14" height="9" rx="2" fill="#deddda" stroke="#9a9996" stroke-width="1"
        transform="rotate(-40 74 76.5)"/>
  <circle cx="101.5" cy="26.5" r="10" fill="#0b77a3" fill-opacity="0.5"/>
  <circle cx="100" cy="24" r="10" fill="#deddda"/>
  <circle cx="100" cy="24" r="10" fill="none" stroke="#9a9996" stroke-width="1"/>
  <circle cx="100" cy="24" r="6" fill="#f6f5f4"/>
  <circle cx="100" cy="24" r="2.5" fill="#5e5c64"/>
</svg>
